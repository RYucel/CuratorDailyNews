name: Cloudflare tetikleyici Worker'ı yayınla

# Sadece elle çalışır. Actions > bu workflow > Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/trigger-worker
          secrets: |
            GITHUB_PAT
        env:
          GITHUB_PAT: ${{ secrets.WORKER_GITHUB_PAT }}
